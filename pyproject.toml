[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-research"
version = "1.0.0"
description = "A physical laboratory for resource-bounded attention scheduling"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
continuum = "continuum.lab.__main__:main"
continuum-legacy = "continuum.cli:main"
continuum-runtime = "continuum.runtime.cli:main"

[tool.setuptools.packages.find]
include = ["continuum*"]

[tool.setuptools.package-data]
"continuum.runtime" = ["ui/*.html", "ui/*.js", "ui/*.css"]

"continuum.lab" = ["ui/*.html", "ui/*.js", "ui/*.css"]
